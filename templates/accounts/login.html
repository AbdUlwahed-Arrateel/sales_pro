{% extends 'base/base.html' %}
{% block title %}تسجيل الدخول{% endblock %}

{% block auth_content %}
<div class="login-page">
    <div class="login-card">
        <div class="login-brand">
            <div class="login-logo">
                <i class="fas fa-chart-line"></i>
            </div>
            <h1>سيلز برو</h1>
            <p>نظام إدارة المبيعات والمخزون</p>
        </div>

        {% if messages %}
        {% for message in messages %}
        <div class="alert alert-{{ message.tags }}">
            <i class="fas fa-exclamation-circle"></i> {{ message }}
        </div>
        {% endfor %}
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label class="form-label">اسم المستخدم</label>
                <div class="input-icon-wrap">
                    <i class="fas fa-user"></i>
                    {{ form.username }}
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">كلمة المرور</label>
                <div class="input-icon-wrap">
                    <i class="fas fa-lock"></i>
                    {{ form.password }}
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 btn-lg mt-4">
                <i class="fas fa-sign-in-alt"></i> تسجيل الدخول
            </button>
        </form>
    </div>
</div>

<style>
.login-page {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
    padding: 20px;
    position: relative; overflow: hidden;
}
.login-page::before {
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(circle at 30% 50%, rgba(79,70,229,0.15) 0%, transparent 60%),
                radial-gradient(circle at 70% 50%, rgba(16,185,129,0.1) 0%, transparent 60%);
}
.login-card {
    background: white; border-radius: 20px; padding: 48px 40px;
    width: 100%; max-width: 420px;
    box-shadow: 0 25px 60px rgba(0,0,0,0.4);
    position: relative; z-index: 1;
}
.login-brand { text-align: center; margin-bottom: 32px; }
.login-logo {
    width: 72px; height: 72px;
    background: linear-gradient(135deg, #4f46e5, #10b981);
    border-radius: 20px; margin: 0 auto 16px;
    display: flex; align-items: center; justify-content: center;
    font-size: 32px; color: white;
    box-shadow: 0 8px 24px rgba(79,70,229,0.4);
}
.login-brand h1 { font-size: 26px; font-weight: 800; color: #0f172a; margin-bottom: 4px; }
.login-brand p { color: #64748b; font-size: 14px; }
.input-icon-wrap { position: relative; }
.input-icon-wrap i { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: #94a3b8; font-size: 15px; }
.input-icon-wrap .form-control { padding-right: 42px; }
</style>
{% endblock %}
