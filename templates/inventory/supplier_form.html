{% extends 'base/base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="page-header"><div><h1 class="page-title">{{ title }}</h1></div>
<div class="page-actions"><a href="/inventory/suppliers/" class="btn btn-outline"><i class="fas fa-arrow-right"></i> رجوع</a></div></div>
<div class="card" style="max-width:500px;margin:0 auto;"><div class="card-body"><form method="post">{% csrf_token %}
{% for field in form %}<div class="form-group"><label class="form-label">{{ field.label }}</label>{{ field }}</div>{% endfor %}
<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:20px;">
<button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> حفظ</button></div></form></div></div>
{% endblock %}
